[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "empire-skills-mcp"
version = "0.1.0"
description = "MCP server exposing the Empire executable agent skills (deterministic, offline)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ncreighton" }]
dependencies = ["mcp>=1.2.0"]

[project.scripts]
empire-skills-mcp = "empire_skills_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ncreighton/empire-skills"

[tool.setuptools]
packages = ["empire_skills_mcp"]

[tool.setuptools.package-data]
empire_skills_mcp = ["skills/**/*"]
